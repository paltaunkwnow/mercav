name: mercav-mail

# Bootstrap is deliberately loopback-only. Public listeners are added explicitly
# with compose.production.yaml AFTER Stalwart setup, TLS and policies are checked.
services:
  stalwart:
    image: ${STALWART_IMAGE:?Set STALWART_IMAGE}
    hostname: ${MX_HOST:-mx1.mercav.lat}
    restart: unless-stopped
    environment:
      STALWART_PUBLIC_URL: https://${MX_HOST:-mx1.mercav.lat}:8443
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:443"
    volumes:
      - ${MAIL_STATE_DIR:-/srv/mercav-mail}/stalwart/config:/etc/stalwart
      - ${MAIL_STATE_DIR:-/srv/mercav-mail}/stalwart/data:/var/lib/stalwart
    # The official image is UID 2000 and needs NET_BIND_SERVICE for its binary.
    # Do not drop that capability or use privileged mode.
    # Keep the vendor file capability usable for low ports. Hardening with
    # no-new-privileges requires a verified high-port listener configuration.
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 90s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - mail

networks:
  mail:
