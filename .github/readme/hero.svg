<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Mercav. Una sola cuenta para publicidad, talento, empleo, planillas y ciberinteligencia en Latinoamérica.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#B8922A"/>
      <stop offset="0.38" stop-color="#D4AF37"/>
      <stop offset="0.5" stop-color="#FFF1BF"/>
      <stop offset="0.62" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8922A"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-560 0; 560 0; 560 0" keyTimes="0; 0.55; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="480" rx="32"/></clipPath>
    <clipPath id="ticker"><rect x="880" y="88" width="304" height="64" rx="32"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .kicker { fill: #D4AF37; font-size: 15px; font-weight: 600; letter-spacing: 4px; }
    .word { fill: url(#shine); font-size: 132px; font-weight: 700; letter-spacing: -5px; }
    .lead { fill: #B9B3A7; font-size: 25px; }
    .meta { fill: #77726A; font-size: 15px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { fill: #8E887D; font-size: 15px; font-weight: 500; }
    .mod { fill: #F5F1E8; font-size: 24px; font-weight: 600; opacity: 0; animation: cycle 15.4s cubic-bezier(.2,.8,.2,1) infinite; }
    .aura { animation: breathe 9s ease-in-out infinite; transform-origin: 640px 0; }
    .rise { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; } .d5 { animation-delay: .7s; }
    .dot { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p { fill: #E8CC6A; opacity: 0; animation: drift 10s linear infinite; }
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(16px); }
      2.57% { opacity: 1; transform: translateY(0); }
      11.71% { opacity: 1; transform: translateY(0); }
      14.29% { opacity: 0; transform: translateY(-16px); }
      100% { opacity: 0; transform: translateY(-16px); }
    }
    @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .45; } }
    @keyframes drift { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .7; } 85% { opacity: .25; } 100% { opacity: 0; transform: translateY(-300px); } }
    @keyframes sweep { 0% { transform: translateX(-700px); } 60%, 100% { transform: translateX(1280px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .mod:first-of-type { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <ellipse class="aura" cx="640" cy="-40" rx="620" ry="300" fill="url(#aura)"/>
  <circle class="p" cx="930" cy="420" r="1.6" style="animation-delay:0s;animation-duration:9s"/>
  <circle class="p" cx="1010" cy="400" r="1.2" style="animation-delay:2.5s;animation-duration:11s"/>
  <circle class="p" cx="1090" cy="430" r="2" style="animation-delay:1.2s;animation-duration:10s"/>
  <circle class="p" cx="1160" cy="410" r="1.4" style="animation-delay:4s;animation-duration:12s"/>
  <circle class="p" cx="860" cy="440" r="1.2" style="animation-delay:5.5s;animation-duration:13s"/>
  <circle class="p" cx="1220" cy="445" r="1.8" style="animation-delay:3s;animation-duration:9.5s"/>
    <rect class="sweep" x="0" y="479" width="600" height="1" fill="url(#rule)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="479" rx="31.5" fill="none" stroke="#D4AF37" stroke-opacity="0.22"/>

  <image class="rise" href="data:image/png;base64," x="88" y="72" width="80" height="80"/>
  <text class="kicker rise d1" x="96" y="212">PLATAFORMA · LATINOAMÉRICA</text>
  <text class="word rise d2" x="86" y="330">Mercav</text>
  <text class="lead rise d3" x="96" y="384">Una sola cuenta para publicidad, talento, empleo, planillas y ciberinteligencia.</text>
  <text class="meta rise d4" x="96" y="436">mercav.lat  ·  app.mercav.lat  ·  kosher.mercav.lat</text>
  <text class="meta rise d5" x="1184" y="436" text-anchor="end">Santa Cruz de la Sierra, Bolivia</text>

  <g class="rise d3">
    <rect x="880" y="88" width="304" height="64" rx="32" fill="#0C0C0C" stroke="#D4AF37" stroke-opacity="0.35"/>
    <circle class="dot" cx="912" cy="120" r="5" fill="#D4AF37"/>
    <text class="label" x="930" y="125">Mercav</text>
    <rect x="990" y="108" width="1" height="24" fill="#D4AF37" fill-opacity="0.35"/>
    <g clip-path="url(#ticker)">
    <text class="mod" x="1002" y="129" style="animation-delay:0.0s">Ads</text>
    <text class="mod" x="1002" y="129" style="animation-delay:2.2s">Services</text>
    <text class="mod" x="1002" y="129" style="animation-delay:4.4s">Jobs</text>
    <text class="mod" x="1002" y="129" style="animation-delay:6.6s">Business</text>
    <text class="mod" x="1002" y="129" style="animation-delay:8.8s">Tools</text>
    <text class="mod" x="1002" y="129" style="animation-delay:11.0s">Pwn</text>
    <text class="mod" x="1002" y="129" style="animation-delay:13.2s">Kosher</text>
    </g>
  </g>
</svg>
