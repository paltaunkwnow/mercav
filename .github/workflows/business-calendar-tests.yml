name: Business y Calendario tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Calendario
        run: npm run test:calendar
      - name: Business (planillas, permisos, cifrado)
        env:
          NEXTAUTH_SECRET: ci-only-secret
        run: npm run test:business
